name = "smartbee-store-connector"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# All settings live in the Cloudflare dashboard (Worker → Settings → Variables and Secrets),
# entered by the business owner. Updates from Git never overwrite them.
keep_vars = true

[observability]
enabled = true

# Remembers each order's receipt. Created automatically on the first deploy.
[[kv_namespaces]]
binding = "RECEIPTS"
